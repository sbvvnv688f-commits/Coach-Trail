<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16281F">
<title>Coach Trail</title>
<style>
:root{
  --paper:#F4F3EE;
  --ink:#16281F;
  --ink-soft:#5C6B62;
  --sapin:#2E6B4F;
  --bistre:#9C6B3F;
  --alerte:#B03A2E;
  --rule:#DAD8D0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

.shell{display:flex;flex-direction:column;height:100vh}

header{
  background:var(--ink);color:var(--paper);
  padding:calc(0.7rem + env(safe-area-inset-top)) 1rem 0.7rem;
  flex-shrink:0;
}
.who{display:flex;gap:0.5rem}
.who button{
  flex:1;padding:0.5rem;border:1px solid rgba(244,243,238,.25);
  background:none;color:rgba(244,243,238,.55);
  border-radius:6px;font-size:0.85rem;font-weight:600;
  font-family:inherit;cursor:pointer;
}
.who button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

nav{
  display:flex;gap:1.2rem;padding:0 1rem;
  background:var(--ink);flex-shrink:0;
}
nav button{
  background:none;border:none;font-family:inherit;cursor:pointer;
  color:rgba(244,243,238,.5);font-size:0.85rem;font-weight:600;
  padding:0.55rem 0;border-bottom:2px solid transparent;
}
nav button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--bistre)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem 3rem}
.panel{display:none}
.panel.on{display:block}

.charge{margin-bottom:1.1rem}
.charge-bars{display:flex;align-items:flex-end;gap:4px;height:56px}
.charge-bars button{
  flex:1;background:var(--rule);border:none;border-radius:2px 2px 0 0;
  cursor:pointer;padding:0;font-family:inherit;
}
.charge-bars button.peak{background:#D9C4AC}
.charge-bars button[aria-current="true"]{background:var(--sapin)}
.charge-bars button[aria-current="true"].peak{background:var(--bistre)}
.charge-scale{
  display:flex;justify-content:space-between;
  font-size:0.6rem;color:var(--ink-soft);margin-top:4px;
}

.weekhead{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--rule);padding-bottom:0.5rem;margin-bottom:0.9rem;
}
.weekhead h2{font-size:1.15rem;font-weight:700}
.weekhead .dates{font-size:0.75rem;color:var(--ink-soft)}
.weektotal{
  display:flex;gap:1.4rem;font-size:0.72rem;color:var(--ink-soft);
  margin-bottom:1rem;
}
.weektotal b{color:var(--ink);font-size:0.95rem;font-weight:700;display:block}

.tag{
  display:inline-block;font-size:0.65rem;font-weight:700;
  padding:2px 7px;border-radius:3px;margin-bottom:0.6rem;
}
.tag.light{background:#E4E8E3;color:var(--sapin)}
.tag.peak{background:#F0E2D2;color:var(--bistre)}
.tag.race{background:#F5DDD9;color:var(--alerte)}

.session{
  width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
  border-left:3px solid var(--sapin);border-radius:0 8px 8px 0;
  padding:0.75rem 0.85rem;margin-bottom:0.5rem;
  font-family:inherit;cursor:pointer;display:block;color:inherit;
}
.session:active{background:#F7F9F7}
.session.key{border-left-color:var(--bistre)}
.session.race{border-left-color:var(--alerte)}
.session .day{font-size:0.7rem;color:var(--ink-soft);font-weight:600}
.session .title{font-size:0.95rem;font-weight:700;margin:1px 0 3px}
.session .meta{font-size:0.78rem;color:var(--ink-soft)}
.session .meta span{margin-right:0.7rem}

.sheet{
  position:fixed;inset:0;background:rgba(22,40,31,.5);
  display:none;align-items:flex-end;z-index:50;
}
.sheet.on{display:flex}
.sheet-in{
  background:var(--paper);width:100%;max-height:88vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:1.1rem 1.1rem calc(2rem + env(safe-area-inset-bottom));
}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:0.9rem}
.sheet-top h3{font-size:1.2rem;font-weight:700;line-height:1.25}
.sheet-top .sub{font-size:0.75rem;color:var(--ink-soft);margin-top:2px}
.sheet-top button{
  background:none;border:none;font-size:1.5rem;line-height:1;
  color:var(--ink-soft);cursor:pointer;font-family:inherit;
}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:0.9rem}
.fig{background:#fff;padding:0.6rem 0.5rem;text-align:center}
.fig b{display:block;font-size:1.1rem;font-weight:700}
.fig span{font-size:0.65rem;color:var(--ink-soft)}
.block{margin-bottom:0.8rem}
.block h4{font-size:0.7rem;color:var(--ink-soft);font-weight:700;margin-bottom:0.25rem}
.block p{font-size:0.9rem}
.block ul{list-style:none;font-size:0.9rem}
.block li{padding-left:0.9rem;position:relative;margin-bottom:0.15rem}
.block li::before{content:"";position:absolute;left:0;top:0.65em;width:5px;height:1px;background:var(--bistre)}
.warn{background:#F7EDE8;border-left:3px solid var(--alerte);padding:0.6rem 0.7rem;border-radius:0 6px 6px 0;font-size:0.85rem}

.scen{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:0.8rem;margin-bottom:0.6rem}
.scen.pick{border-color:var(--sapin);border-width:2px}
.scen-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.25rem}
.scen-top b{font-size:0.9rem}
.scen-top .t{font-size:1.25rem;font-weight:700}
.scen p{font-size:0.78rem;color:var(--ink-soft)}

.chk{border-left:2px solid var(--rule);padding-left:0.9rem;margin-left:0.3rem}
.chk-item{position:relative;padding-bottom:1rem}
.chk-item::before{content:"";position:absolute;left:calc(-0.9rem - 5px);top:0.45em;width:8px;height:8px;border-radius:50%;background:var(--bistre)}
.chk-item b{font-size:0.9rem}
.chk-item p{font-size:0.8rem;color:var(--ink-soft)}

label{display:block;font-size:0.7rem;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
input,select{
  width:100%;padding:0.5rem;border:1px solid var(--rule);border-radius:6px;
  font-size:1rem;font-family:inherit;background:#fff;color:var(--ink);
  margin-bottom:0.6rem;-webkit-appearance:none;
}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
button.act{
  width:100%;padding:0.7rem;border:none;border-radius:6px;
  background:var(--sapin);color:var(--paper);font-size:0.9rem;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.zrow{display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid var(--rule);font-size:0.85rem}
.zrow span{color:var(--ink-soft)}
h3.sec{font-size:0.95rem;font-weight:700;margin:1.2rem 0 0.6rem}
.log{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:0.6rem;margin-bottom:0.4rem;font-size:0.85rem}
.log .meta{font-size:0.75rem;color:var(--ink-soft);margin-top:2px}
.empty{font-size:0.85rem;color:var(--ink-soft);padding:1rem 0;text-align:center}
.drop{
  width:100%;display:block;text-align:left;background:#fff;
  border:1px dashed var(--sapin);border-radius:8px;
  padding:1rem;font-family:inherit;color:inherit;cursor:pointer;margin-bottom:1rem;
}
.drop.over{background:#EDF3EF}
.drop b{display:block;font-size:0.95rem;font-weight:700}
.drop span{font-size:0.78rem;color:var(--ink-soft)}
.split{display:grid;grid-template-columns:2.2rem 1fr auto;gap:0.6rem;align-items:center;padding:0.35rem 0;border-bottom:1px solid var(--rule);font-size:0.82rem}
.split .kmno{color:var(--ink-soft);font-size:0.75rem}
.split .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.split .bar i{display:block;height:100%;background:var(--sapin)}
.split .bar i.slow{background:var(--bistre)}
.split .val{text-align:right;white-space:nowrap}
.split .val em{font-style:normal;color:var(--ink-soft);font-size:0.72rem;margin-left:0.4rem}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:0.6rem;padding:0.4rem 0;border-bottom:1px solid var(--rule);font-size:0.85rem}
.cmp span{color:var(--ink-soft)}
.cmp .ok{color:var(--sapin);font-weight:700}
.cmp .off{color:var(--bistre);font-weight:700}
.opt{
  display:block;text-align:left;background:#fff;border:1px solid var(--rule);
  border-radius:8px;padding:0.6rem;font-family:inherit;color:inherit;cursor:pointer;
  margin-bottom:0.6rem;
}
.opt.on{border-color:var(--sapin);border-width:2px;padding:calc(0.6rem - 1px)}
.opt b{display:block;font-size:0.9rem;font-weight:700}
.opt span{font-size:0.72rem;color:var(--ink-soft)}
.toast{
  position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:0.6rem 1.1rem;border-radius:6px;font-size:0.85rem;z-index:99;
}
:focus-visible{outline:2px solid var(--bistre);outline-offset:2px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="who">
      <button onclick="setAth('edgar')" aria-pressed="true" id="wE">Edgar</button>
      <button onclick="setAth('laurie')" aria-pressed="false" id="wL">Laurie</button>
    </div>
  </header>
  <nav>
    <button onclick="setTab('plan')" aria-selected="true" id="tPlan">Plan</button>
    <button onclick="setTab('goal')" aria-selected="false" id="tGoal">Objectif</button>
    <button onclick="setTab('me')" aria-selected="false" id="tMe">Réglages</button>
    <button onclick="setTab('log')" aria-selected="false" id="tLog">Carnet</button>
  </nav>

  <main>
    <section id="plan" class="panel on">
      <div class="charge">
        <div class="charge-bars" id="bars"></div>
        <div class="charge-scale"><span>7 sept</span><span>charge hebdomadaire</span><span>1 nov</span></div>
      </div>
      <div class="weekhead">
        <h2 id="wkTitle">Semaine 1</h2>
        <div class="dates num" id="wkDates"></div>
      </div>
      <div id="wkTag"></div>
      <div class="weektotal">
        <div><b class="num" id="wkKm"></b>volume</div>
        <div><b class="num" id="wkD"></b>dénivelé positif</div>
        <div><b class="num" id="wkLong"></b>sortie longue</div>
      </div>
      <div id="sessions"></div>
    </section>

    <section id="goal" class="panel"></section>

    <section id="me" class="panel">
      <h3 class="sec">Allures de référence sur plat</h3>
      <div class="pair">
        <div><label for="aFond">Fondamental (min/km)</label><input type="number" step="0.1" id="aFond"></div>
        <div><label for="aTempo">Tempo (min/km)</label><input type="number" step="0.1" id="aTempo"></div>
        <div><label for="aSeuil">Seuil (min/km)</label><input type="number" step="0.1" id="aSeuil"></div>
        <div><label for="aRecup">Récupération (min/km)</label><input type="number" step="0.1" id="aRecup"></div>
      </div>
      <label for="aFc">Fréquence cardiaque maximale (bpm)</label>
      <input type="number" id="aFc">
      <button class="act" onclick="saveMe()">Enregistrer les allures</button>
      <div id="rythme"></div>
      <div id="zones"></div>
    </section>

    <section id="log" class="panel">
      <button class="drop" id="drop" onclick="pick.click()">
        <b>Importer une séance Suunto</b>
        <span>Export JSON de la montre. Touche pour choisir le fichier.</span>
      </button>
      <input type="file" id="pick" accept=".json,application/json" hidden>
      <div id="suuntoOut"></div>

      <h3 class="sec">Ou saisir à la main</h3>
      <label for="lDate">Date</label><input type="date" id="lDate">
      <label for="lType">Séance</label>
      <select id="lType">
        <option value="">Choisir</option>
        <option>Seuil</option><option>Côtes</option>
        <option>Endurance</option><option>Sortie longue</option>
        <option>Natation</option>
      </select>
      <div class="pair">
        <div><label for="lKm">Distance (km)</label><input type="number" step="0.1" id="lKm"></div>
        <div><label for="lMin">Durée (min)</label><input type="number" id="lMin"></div>
        <div><label for="lD">D+ (m)</label><input type="number" id="lD"></div>
        <div><label for="lFc">FC moyenne</label><input type="number" id="lFc"></div>
      </div>
      <label for="lNote">Sensations, douleurs</label><input type="text" id="lNote" placeholder="Jambe gauche, fatigue, météo…">
      <button class="act" onclick="saveLog()">Enregistrer la séance</button>
      <h3 class="sec">Séances enregistrées</h3>
      <div id="logList"></div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-in" id="sheetIn"></div>
</div>

<script>
const DATES=["7 – 13 sept","14 – 20 sept","21 – 27 sept","28 sept – 4 oct","5 – 11 oct","12 – 18 oct","19 – 25 oct","26 oct – 1 nov"];

const PLAN={

  {d:"Jeudi",t:"Endurance fondamentale",k:7,dp:60,f:"fond",c:["45 à 60 min sur terrain roulant","Allure basse, respiration facile"],w:"Cette séance ne doit jamais être rapide. Si tu finis essoufflé, elle est ratée."},
  {d:"Dimanche",t:"Sortie longue 16 km",k:16,dp:300,f:"fond",c:["16 km à allure fondamentale stricte","Terrain varié, aucun bloc rapide"],w:""}

  {d:"Mercredi",t:"Côtes 7 × 2 min",k:8,dp:350,f:"cotes",c:["15 min d'échauffement","7 montées de 2 min","Descente en trottinant","10 min de retour au calme","15 min de renforcement"],w:""},
  {d:"Jeudi",t:"Endurance fondamentale",k:7,dp:60,f:"fond",c:["45 à 60 min, allure basse"],w:""},

laurie:{

 w:[
 [

  const a=me[ath];

  const base=map[x.f]||a.fond;
  const m=Math.round(x.k*base+(x.dp/100)*5);
  return m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m+" min";
}

let last=null;

pick.addEventListener("change",function(e){if(e.target.files.length)readFile(e.target.files[0])});
["dragenter","dragover"].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
["dragleave","drop"].forEach(function(ev){
  drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
drop.addEventListener("drop",function(e){
  if(e.dataTransfer.files.length)readFile(e.dataTransfer.files[0])});

function readFile(f){
  const r=new FileReader();
  r.onerror=function(){fail("Le fichier n'a pas pu être lu.")};
  r.onload=function(e){
    let j;
    try{j=JSON.parse(e.target.result)}
    catch(err){return fail("Ce fichier n'est pas du JSON valide.")}
    try{parseSuunto(j)}
    catch(err){fail("Structure inattendue : "+err.message)}
  };
  r.readAsText(f);
}
function fail(m){
  suuntoOut.innerHTML='<div class="warn">'+m+' Exporte la séance depuis l\'application Suunto au format JSON, puis réessaie.</div>';
}

function findLog(j){
  if(j&&j.DeviceLog)return j.DeviceLog;
  if(j&&j.data&&j.data.DeviceLog)return j.data.DeviceLog;
  return null;
}

function parseSuunto(j){
  const dl=findLog(j);
  if(!dl||!dl.Header)throw new Error("en-tête introuvable");
  const h=dl.Header;
  const km=(h.Distance||0)/1000;
  const sec=h.Duration||0;
  const asc=Math.round(h.Ascent||0), desc=Math.round(h.Descent||0);
  const hrA=h.HR&&h.HR.Avg?Math.round(h.HR.Avg*(h.HR.Avg<10?60:1)):null;
  const hrM=h.HR&&h.HR.Max?Math.round(h.HR.Max*(h.HR.Max<10?60:1)):null;
  const pace=km>0?(sec/60)/km:0;
  const dt=h.DateTime?new Date(h.DateTime):null;

  last={km:km,sec:sec,asc:asc,desc:desc,hrA:hrA,pace:pace,
        date:dt?dt.toISOString().slice(0,10):""};

  const laps=collectLaps(dl);
  suuntoOut.innerHTML=
    '<div class="weekhead"><h2>Séance importée</h2><div class="dates num">'+
      (dt?dt.toLocaleDateString("fr-FR"):"date inconnue")+'</div></div>'+
    '<div class="figs">'+
      fig(km.toFixed(1)+" km","distance")+
      fig(asc+" m","dénivelé positif")+
      fig(hms(sec),"durée")+
      fig(mmss(pace),"allure moyenne")+
      fig(desc+" m","dénivelé négatif")+
      fig(hrA?hrA+" bpm":"—","fréquence moyenne")+
    '</div>'+
    compare(km,asc,sec)+
    splitsHtml(laps,pace)+
    zoneHtml(hrA,hrM)+
    '<button class="act" onclick="toLog()" style="margin-top:1rem">Ajouter au carnet</button>';
}

function fig(v,l){return '<div class="fig"><b class="num">'+v+'</b><span>'+l+'</span></div>'}

function collectLaps(dl){
  const out=[],s=dl.Samples||[];
  for(let i=0;i<s.length;i++){
    const w=s[i]&&s[i].Window;
    if(!w)continue;
    const ty=(w.Type||"").toLowerCase();
    if(ty.indexOf("lap")<0)continue;
    const d=(w.Distance||0)/1000, t=w.Duration||0;
    if(d<=0||t<=0)continue;
    let hr=null;
    if(Array.isArray(w.HR)&&w.HR[0]&&w.HR[0].Avg)hr=Math.round(w.HR[0].Avg*(w.HR[0].Avg<10?60:1));
    else if(w.HR&&w.HR.Avg)hr=Math.round(w.HR.Avg*(w.HR.Avg<10?60:1));
    out.push({d:d,t:t,asc:Math.round(w.Ascent||0),hr:hr,pace:(t/60)/d});
  }
  return out;
}

function splitsHtml(l,avg){
  if(!l.length)return '<div class="block"><h4>Tours par kilomètre</h4><p style="font-size:.85rem;color:var(--ink-soft)">Ce fichier ne contient pas de tours automatiques. Active le tour au kilomètre sur la montre pour les obtenir.</p></div>';
  const worst=Math.max.apply(null,l.map(function(x){return x.pace}));
  return '<h3 class="sec">Tours par kilomètre</h3>'+l.map(function(x,i){
    const w=Math.max(6,Math.round(100-(x.pace/worst)*70));
    const slow=x.pace>avg*1.1?" slow":"";
    return '<div class="split"><span class="kmno num">'+(i+1)+'</span>'+
      '<span class="bar"><i class="'+slow+'" style="width:'+w+'%"></i></span>'+
      '<span class="val num">'+mmss(x.pace)+
      (x.asc?'<em>'+x.asc+' m</em>':"")+
      (x.hr?'<em>'+x.hr+'</em>':"")+'</span></div>';
  }).join("")+
  '<p style="font-size:.75rem;color:var(--ink-soft);margin-top:.5rem">Les tours en ocre sont plus de 10 % au-dessus de l\'allure moyenne, ce qui correspond en général aux portions montantes.</p>';
}

function compare(km,asc,sec){
  const s=weekSessions();
  let best=null,gap=1e9;
  for(let i=0;i<s.length;i++){
    if(!s[i].k)continue;
    const g=Math.abs(s[i].k-km)+Math.abs(s[i].dp-asc)/100;
    if(g<gap){gap=g;best=s[i]}
  }
  if(!best||gap>12)return "";
  const dk=km-best.k, dd=asc-best.dp;
  return '<h3 class="sec">Comparaison au plan</h3>'+
    '<p style="font-size:.8rem;color:var(--ink-soft);margin-bottom:.5rem">Séance la plus proche : '+
    best.d.toLowerCase()+' de la semaine '+(wk+1)+', '+best.t+'.</p>'+
    row("Distance",best.k+" km",km.toFixed(1)+" km",dk,1.5)+
    row("Dénivelé positif",best.dp+" m",asc+" m",dd,80)+
    row("Durée estimée",dur(best),hms(sec),0,null);
}
function row(lab,prev,fait,ecart,tol){
  let cls="",txt="";
  if(tol!==null){
    cls=Math.abs(ecart)<=tol?"ok":"off";
    txt=(ecart>0?"+":"")+(Math.abs(ecart)<10?ecart.toFixed(1):Math.round(ecart));
  }
  return '<div class="cmp"><span>'+lab+'</span><span class="num">'+prev+' → '+fait+
    '</span><span class="'+cls+' num">'+txt+'</span></div>';
}

function zoneHtml(hrA,hrM){
  if(!hrA)return "";
  const a=me[ath],p=hrA/a.fc;
  let z="zone 1";
  if(p>=.94)z="zone 5";else if(p>=.88)z="zone 4";
  else if(p>=.80)z="zone 3";else if(p>=.70)z="zone 2";
  let msg='Fréquence moyenne en '+z+', soit '+Math.round(p*100)+" % de ta fréquence maximale.";
  if(z==="zone 4"||z==="zone 5")msg+=" Pour une sortie longue ou une endurance fondamentale, c'est trop haut : l'intérêt de ces séances tient à leur allure basse.";
  return '<div class="block" style="margin-top:1rem"><h4>Lecture cardiaque</h4><p style="font-size:.85rem">'+msg+
    (hrM?' Maximale relevée : <span class="num">'+hrM+' bpm</span>.':"")+'</p></div>';
}

function toLog(){
  if(!last)return;
  logs.push({dt:last.date,ty:"Importée",km:last.km.toFixed(1),
    mn:Math.round(last.sec/60),dp:last.asc,fc:last.hrA||"",no:"",a:ath});
  try{localStorage.setItem("ct_carnet",JSON.stringify(logs))}catch(e){}
  toast("Séance ajoutée au carnet");drawLog();
}

function hms(s){
  const h=Math.floor(s/3600),m=Math.round((s%3600)/60);
  return h?h+"h"+String(m).padStart(2,"0"):m+" min";
}
function mmss(p){
  if(!p||!isFinite(p))return "—";
  const m=Math.floor(p);
  return m+"'"+String(Math.round((p-m)*60)).padStart(2,"0");
}

function toast(t){
  const d=document.createElement("div");d.className="toast";d.textContent=t;
  document.body.appendChild(d);setTimeout(function(){d.remove()},2200);
}

render();
</script>
